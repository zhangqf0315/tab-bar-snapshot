<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标签栏快照</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <section class="panel current-panel">
        <header class="section-header">
          <div class="title-row">
            <img class="app-icon" src="assets/icon-32.png" alt="">
            <div>
              <h1>标签栏快照</h1>
              <p id="currentSummary">正在读取浏览器标签...</p>
            </div>
          </div>
          <button class="icon-button" id="refreshTabs" type="button" title="刷新浏览器标签" aria-label="刷新浏览器标签">
            ↻
          </button>
        </header>

        <div class="save-row">
          <label class="name-field">
            <span>文件夹名称</span>
            <input id="snapshotName" type="text" autocomplete="off" placeholder="默认使用当前日期时间">
          </label>
          <button id="saveSnapshot" class="primary-button" type="button">保存快照</button>
        </div>

        <div class="bulk-row">
          <button id="selectAll" class="text-button" type="button">全选</button>
          <button id="selectNone" class="text-button" type="button">全不选</button>
          <span id="selectedCount">0 个标签已选择</span>
        </div>

        <ul id="currentTabs" class="tab-list" aria-label="当前标签"></ul>
      </section>

      <section class="panel saved-panel">
        <header class="section-header">
          <div class="title-row compact">
            <span class="section-mark"></span>
            <div>
            <h2>已保存文件夹</h2>
            <p id="savedSummary">暂无快照</p>
            </div>
          </div>
        </header>
        <div id="savedSnapshots" class="snapshot-list"></div>
      </section>
    </main>

    <template id="tabItemTemplate">
      <li class="tab-item">
        <label class="check-line">
          <input type="checkbox" class="tab-check" checked>
          <span class="favicon-wrap">
            <img class="favicon" alt="">
          </span>
          <span class="tab-text">
            <span class="tab-title"></span>
            <span class="tab-url"></span>
          </span>
        </label>
      </li>
    </template>

    <template id="snapshotTemplate">
      <article class="snapshot-card">
        <div class="snapshot-head">
          <div>
            <h3 class="snapshot-title"></h3>
            <p class="snapshot-meta"></p>
          </div>
          <div class="snapshot-actions">
            <button class="secondary-button restore-button" type="button">打开</button>
            <button class="danger-button delete-button" type="button">删除</button>
          </div>
        </div>
        <details>
          <summary class="snapshot-detail-title">查看标签</summary>
          <ul class="saved-tab-list"></ul>
        </details>
      </article>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
